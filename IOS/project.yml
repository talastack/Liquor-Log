# XcodeGen project definition.
#
# The .xcodeproj is GENERATED, not committed. Run:
#
#     cd IOS && xcodegen generate
#
# A .pbxproj is a large UUID-keyed format that conflicts on almost every
# parallel edit and cannot be reviewed in a diff. It is also the reason this
# scaffold could be authored on Windows at all: there is no way to hand-write a
# valid pbxproj without Xcode to validate it.
#
# Install XcodeGen with: brew install xcodegen

name: LiquorLog

options:
  # PLACEHOLDER, and deliberately so. The bundle identifier is frozen at the
  # first App Store submission -- a new one is a different app, with a separate
  # listing, no reviews and no upgrade path for existing installs. It can be
  # changed freely any number of times before that, so it must be finalised
  # before submission and not before. The product has no name yet.
  bundleIdPrefix: com.talastack.liquorlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Set to `complete` from the first commit deliberately. Retrofitting strict
    # concurrency onto an established actor model is far more work than
    # starting with it, and LiquorEngine is Sendable throughout already.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  LiquorEngine:
    path: Packages/LiquorEngine
  # The app imports LiquorData directly -- AppEnvironment, the repositories and
  # every screen that reads a bottle. A package a target imports has to be
  # declared for that target: without this the build fails at module resolution
  # with "unable to resolve module dependency", which says nothing about which
  # target is missing it.
  #
  # GRDB is deliberately absent. No file under App/ imports it or names a GRDB
  # type -- LiquorData wraps all of that -- so the app links what it actually
  # uses and nothing more.
  LiquorData:
    path: Packages/LiquorData

# Real values live in IOS/Secrets.xcconfig, which is gitignored and included
# optionally by Base.xcconfig -- so a fresh clone builds with sync switched off
# rather than failing on a missing file.
configFiles:
  debug: Config/Base.xcconfig
  release: Config/Base.xcconfig

targets:
  LiquorLog:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: LiquorEngine
      - package: LiquorData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talastack.liquorlog
        # Written here so `xcodegen generate` stops wiping it. Left out, every
        # regeneration clears Signing & Capabilities and the team has to be
        # re-picked by hand -- a step that is invisible until an archive fails
        # at the very end of a slow build.
        #
        # UARGCN2739 is TALASTACK LLC. Automatic signing still manages the
        # profiles; this only says whose account to manage them under.
        DEVELOPMENT_TEAM: UARGCN2739
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: LiquorLog
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # No UIUserInterfaceStyle key on purpose: the app ships both palettes
        # and honours the system setting. Pinning either one here would
        # silently override that.
        SUPPORTS_MACCATALYST: NO

  LiquorLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: LiquorLog
      # A target links what its OWN sources import. Hosting under LiquorLog
      # does not cover it: the host links these for itself, and the test bundle
      # is a separate binary that resolves its own references.
      - package: LiquorEngine
      - package: LiquorData
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Xcode signs test bundles, and a bundle with no Info.plist cannot be
        # signed. Generated rather than committed: a test bundle's plist
        # carries nothing worth hand-maintaining.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LiquorLog:
    build:
      targets:
        LiquorLog: all
    test:
      # ONLY this target runs here. LiquorEngine carries its own test target
      # and Xcode does NOT pick it up from the local package reference -- it
      # runs in CI as an explicit `swift test` step. If a second package is
      # ever added, add a step for it too; nothing here will do it for you.
      targets:
        - LiquorLogTests
      gatherCoverageData: true
      coverageTargets:
        - LiquorLog
    run:
      config: Debug
    archive:
      config: Release
